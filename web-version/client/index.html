<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
  <title>Document</title>
</head>
<body class="body">
  <header>
    <h1>Tic, Tac, GO!</h1>
  </header>

  <div class="grid-area">
    <div class="grid-row">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <div class="grid-row">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <div class="grid-row">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div
        class="legend-swatch"
        style="background: var(--player-one)"
      ></div>
      Player One
    </div>
    <div class="legend-item">
      <div
        class="legend-swatch"
        style="background: var(--player-two)"
      ></div>
      Player Two
    </div>
  </div>

</body>
</html>
